# docker compose up --build        ->  http://localhost:8000
#
#   db         PostgreSQL 16: event store (ledger_events) + read model (ledger_read)
#   web        Django + gunicorn: migrations, demo seed, command handlers, pages
#   projector  background worker: event log -> denormalized read tables + webhooks
#
# The AI assistant reaches Ollama running on the HOST PC (Windows app) through
# host.docker.internal.  Put GEMINI_API_KEY in the .env file to enable Gemini.
name: cqrs-ledger

x-app: &app
  build: .
  image: cqrs-ledger:latest
  restart: unless-stopped
  environment:
    DB_MODE: postgres
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ledger
    POSTGRES_PASSWORD: ledger
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: "*"
    CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    SNAPSHOT_INTERVAL: ${SNAPSHOT_INTERVAL:-5}
    PROJECTOR_POLL_SECONDS: ${PROJECTOR_POLL_SECONDS:-0.2}
    WEBHOOK_URLS: http://web:8000/webhooks/receive/
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
    AI_PROVIDER: ${AI_PROVIDER:-auto}
    OLLAMA_URL: http://host.docker.internal:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"   # optional: inspect with pgAdmin / psql on localhost:5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 300"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  projector:
    <<: *app
    command: python manage.py run_projector
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
